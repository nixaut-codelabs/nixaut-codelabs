<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" width="760" height="200" role="img" aria-label="Terminal: bun test, bun run bench, git push — the workflow">
  <style>
    .t1 { animation: type .8s steps(10) .6s both; }
    .t2 { animation: type 1.1s steps(15) 1.8s both; }
    .t3 { animation: type .8s steps(10) 3.2s both; }
    .c1 { opacity: 0; animation: blink 1s steps(1) .6s 1; }
    .c2 { opacity: 0; animation: blink 1s steps(1) 1.8s 1; }
    .c3 { opacity: 0; animation: blink 1s steps(1) 3.2s infinite; }
    .m1 { animation: fade .4s ease-out 1.5s both; }
    .m2 { animation: fade .4s ease-out 3.0s both; }
    .m3 { animation: fade .4s ease-out 4.1s both; }
    @keyframes type { from { clip-path: inset(0 100% 0 0); } }
    @keyframes fade { from { opacity: 0; } }
    @keyframes blink { 0%, 60% { opacity: 1; } 60.1%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .t1, .t2, .t3, .c1, .c2, .c3, .m1, .m2, .m3 { animation: none; }
      .c1, .c2, .c3 { opacity: 0; }
    }
  </style>

  <!-- window -->
  <rect x="0" y="0" width="760" height="200" rx="10" fill="#101014"/>
  <rect x="0" y="0" width="760" height="34" rx="10" fill="#17171c"/>
  <rect x="0" y="24" width="760" height="10" fill="#17171c"/>
  <circle cx="22" cy="17" r="5.5" fill="#e8a33d"/>
  <circle cx="42" cy="17" r="5.5" fill="#3a3a44"/>
  <circle cx="62" cy="17" r="5.5" fill="#3a3a44"/>
  <text x="380" y="22" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.5" fill="#6a6a74">umut@lab — ~/work</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
    <!-- line 1 -->
    <text x="28" y="76" fill="#6a6a74">$</text>
    <text class="t1" x="48" y="76" fill="#f4f4f2">bun test</text>
    <rect class="c1" x="130" y="60" width="9" height="20" fill="#e8a33d"/>
    <text class="m1" x="300" y="76" fill="#4a4a54"># the merge gate</text>

    <!-- line 2 -->
    <text x="28" y="116" fill="#6a6a74">$</text>
    <text class="t2" x="48" y="116" fill="#f4f4f2">bun run bench</text>
    <rect class="c2" x="197" y="100" width="9" height="20" fill="#e8a33d"/>
    <text class="m2" x="300" y="116" fill="#4a4a54"># numbers, or it didn't happen</text>

    <!-- line 3 -->
    <text x="28" y="156" fill="#6a6a74">$</text>
    <text class="t3" x="48" y="156" fill="#f4f4f2">git push</text>
    <rect class="c3" x="130" y="140" width="9" height="20" fill="#e8a33d"/>
    <text class="m3" x="300" y="156" fill="#4a4a54"># only when green</text>
  </g>
</svg>
